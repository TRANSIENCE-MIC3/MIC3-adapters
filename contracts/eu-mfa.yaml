model: eu-mfa
display_name: EU-MFA (steel, with buildings and vehicles)
source:
  repo: wupperinst/transience-eu-mfa
  branch: main
  commit: 80aac47bfe491725684893379ad9b541770928a8
  date: 2026-10-21
platform_image: "MIC3-API integrations/eu_mfa (same commit; only the buildings mode is registered)"
dependencies: []

run:
  baseline_candidates:
    - {command: ["python", "eumfa_steel.py", "-s", "BASE_fd-sv-gr"], note: "steel top-down, final demand from start value and growth rate (OPEN-GEM link)"}
    - {command: ["python", "eumfa_steel.py", "-s", "BASE_fd"], note: "steel top-down, final demand given directly (FinalDemand.csv)"}
    - {command: ["python", "eumfa_combined.py"], note: "buildings + vehicles bottom-up, then steel top-down; the first MIC3 base run fed ITOM from the combined outputs"}
  working_directory: .
  config_file: "config/<modelclass>_<scenario>.yml (general config: scenario, model_class; customization: model_driven)"
  config_keys: [scenario, input_data_path, output_path, customization.model_driven, do_export.csv]
  input_location: "data/<scenario>_<modelclass>/input/datasets (scenario suffix pd, fd or fd-sv-gr gives how the model is driven)"
  output_location: "data/<scenario>_<modelclass>/output/export/flows"
  time: annual, 1946-2100 for steel

inputs:
  - link: B02
    from: open-gem
    description: "Annual growth rates of steel final demand by EU-MFA sector, from OPEN-GEM DEMAND (IND31 Metalware; IND33 Automotive, Domestic appliances, Mechanical Engineering, Other Transport; IND35 Construction) and GDP (Miscellaneous); OPEN-GEM EU27 values applied to EU27+1; 5-year values interpolated to annual 2017-2050; 1:1 coupling of monetary and physical growth"
    path: data/baseline_fd-sv-gr_steel/input/datasets/growth_rate.csv
    in_repo: true
    format: csv
    columns: [region, time, sector, intermediate, product, element, value]
    dimensions: {region: [EU27+1], intermediate: [Steel Intermediary], element: [All]}
    units: fraction per year
    existing_code:
      repo: TRANSIENCE-MIC3/MIC3-adapters
      path: upstream/eu-mfa/opengem_to_eumfa.R
      config: upstream/eu-mfa/config.yml
      reads: "OPEN-GEM report sheets MACRO_BASE and SECTOR_BASE exported to ';'-separated CSV; growth_rate template; start_value.csv; historical final demand"
      also_writes: "FinalDemand.csv (history before the start year + start value compounded with the growth rates), used for fd-driven runs and by the ITOM interface"
      note: "runs only inside RStudio (setwd via rstudioapi); the OPEN-GEM CSV export is manual"
  - link: B02
    from: open-gem
    description: Start value of final demand (2023)
    path: data/baseline_fd-sv-gr_steel/input/datasets/start_value.csv
    in_repo: true
    format: csv
    columns: [region, time, sector, intermediate, product, element, value]
    units: kt
    note: Not from OPEN-GEM; growth rates apply to it
  - link: B02
    from: open-gem
    description: Building inflow and stock (commercial stock driven by OPEN-GEM services production, 30% elasticity; residential by population)
    path: data/baseline_buildings/input/datasets/building_inflow.csv
    in_repo: true
    format: csv
    columns: []
    note: Column structure not yet checked; no buildings coupling script received
  - link: B04
    from: open-prom
    description: New passenger car registrations by technology (OPEN-PROM capacity additions scaled to Eurostat 2024 registrations per country)
    path: data/baseline_vehicles/input/datasets/vehicle_inflow.csv
    in_repo: true
    format: csv
    columns: [Region, Vehicle type, Time, Value]
    dimensions: {Region: "ISO-3 country codes", Vehicle type: "11 types, e.g. 'Conventional Hybrid – Diesel Oil' (en dash)"}
    units: "unknown in the target file; source sheet PassengerCars is in million vehicles"
    source: "OPEN-PROM baseline workbook, sheet PassengerCars, Capacity Additions|Passenger Cars|<technology>"
    existing_code: "scaling script not received (E3M)"
  - link: B06
    from: remind-mfa
    description: "Imports and exports of new steel goods and intermediate products. Goods trade (per REMIND good) x product share within the EU-MFA sector group; intermediate-product trade (REMIND total) x sector share x product share within the sector; shares from historical EU-MFA final demand; REMIND t converted to kt"
    paths:
      - data/baseline_fd-sv-gr_steel/input/datasets/ImportNewGoods.csv
      - data/baseline_fd-sv-gr_steel/input/datasets/ExportNewGoods.csv
      - data/baseline_fd-sv-gr_steel/input/datasets/ImportNewProducts.csv
      - data/baseline_fd-sv-gr_steel/input/datasets/ExportNewProducts.csv
    path: data/baseline_fd-sv-gr_steel/input/datasets/ImportNewGoods.csv
    in_repo: true
    format: csv
    columns: [region, time, sector, intermediate, product, element, value]
    units: kt
    mapping: "REMIND EUR -> EU27+1; Construction -> Construction; Transport -> Automotive, Other Transport; Machinery -> Mechanical Engineering; Products -> Miscellaneous, Metalware, Domestic appliances"
    existing_code:
      repo: TRANSIENCE-MIC3/MIC3-adapters
      path: upstream/eu-mfa/remindmfa_to_eumfa.R
      config: upstream/eu-mfa/config.yml
      note: "'fixed' version, runnable with Rscript"
      reads: "REMIND-MFA csv/flows: good_market__exports.csv, imports__good_market.csv, ip_market__exports.csv, imports__ip_market.csv"

outputs:
  - link: B05
    to: remind-mfa
    description: Demand, collected and lost end-of-life steel, available scrap
    path: <output_path>/export/flows/*.csv
    in_repo: false
    format: csv per flow (flodym naming, e.g. steel_goods_market__end_use_stock.csv)
    note: "first base run: handed over manually to the REMIND-MFA team"
  - link: B07
    to: forecast-sites
    description: Steel product market inflow and available scrap
    files: [sysenv__steel_product_market.csv, waste_management__available_scrap_sysenv.csv]
    path: <output_path>/export/flows/
    in_repo: false
    columns: [region, time, sector, intermediate, product, element, value]
    units: kt
  - link: B08
    to: itom
    files: [waste_management__available_scrap_sysenv.csv, steel_goods_manufacturing__sysenv.csv]
    path: <output_path>/export/flows/
    in_repo: false
    note: "ITOM also reads FinalDemand.csv, which is the EU-MFA input dataset written by opengem_to_eumfa.R, not an EU-MFA output"

open_questions:
  - "Which run is the MIC3 baseline: top-down BASE_fd-sv-gr / BASE_fd, or the combined run?"
  - "Population for buildings: OPEN-GEM or scenario assumption?"
  - "Units of vehicle_inflow.csv and the OPEN-PROM scaling script"
  - "Publish opengem_to_eumfa.R, remindmfa_to_eumfa.R and config.yml in the EU-MFA repository (copies kept in upstream/eu-mfa until then)"
  - "Is the 'fixed' remindmfa_to_eumfa.R the version to use?"
